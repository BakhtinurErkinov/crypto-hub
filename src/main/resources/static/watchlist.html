<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watchlist | CryptoHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <script src="nav.js"></script>

    <div class="container" id="auth-guard">
        <div class="empty-state">
            <i class="fas fa-eye-slash"></i>
            <h3>Authentication Required</h3>
            <p style="margin-top: 8px;">Please login to view your watchlist.</p>
            <a href="auth.html" class="btn btn-primary" style="margin-top: 16px;">Go to Login</a>
        </div>
    </div>

    <div class="container" id="main-content" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h2>My Watchlist</h2>
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="add-coin-input" placeholder="Enter coin ID (e.g. bitcoin)">
                <button class="btn btn-primary" onclick="addWatchlist()" style="position: absolute; right: 4px; top: 4px; bottom: 4px; padding: 0 12px; font-size: 12px;">Add</button>
            </div>
        </div>

        <div id="watchlist-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
            <!-- JS populated -->
        </div>
    </div>

    <script src="watchlist.js"></script>
</body>
</html>
