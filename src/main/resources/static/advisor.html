<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto Advisor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h1>🤖 Crypto AI Advisor</h1>

    <textarea id="question" placeholder="Ask anything about crypto..."></textarea>
    <button onclick="askAI()">Ask</button>

    <div id="answer-box"></div>
</div>

<script>
    async function askAI() {
        const question = document.getElementById("question").value;

        const response = await fetch("http://localhost:8080/api/advisor", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({question})
        });

        const data = await response.json();
        document.getElementById("answer-box").innerText = data.answer;
    }
</script>

</body>
</html>
