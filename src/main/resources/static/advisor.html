<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Advisor | CryptoHub</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 180px);
            max-height: 800px;
        }
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 15px;
        }
        .msg-user {
            align-self: flex-end;
            background: var(--gradient);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-ai {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            border-radius: 0 0 16px 16px;
            display: flex;
            gap: 12px;
        }
        .chat-input {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px 20px;
            color: white;
            outline: none;
        }
        .chat-input:focus {
            border-color: var(--accent);
        }
        .send-btn {
            background: var(--gradient);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover {
            transform: scale(1.05);
        }
        .chips {
            display: flex;
            gap: 8px;
            padding: 0 24px 16px;
            flex-wrap: wrap;
        }
        .chip {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chip:hover {
            background: var(--surface-hover);
            color: var(--accent);
        }
        .typing {
            display: flex;
            gap: 4px;
            padding: 8px 12px;
        }
        .dot {
            width: 8px; height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <script src="nav.js"></script>

    <div class="container">
        <div class="glass-card" style="padding: 0; display: flex; flex-direction: column;">
            <div style="padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="display: flex; align-items: center; gap: 8px;">
                    <i class="fas fa-robot text-positive"></i> AI Crypto Advisor
                </h3>
                <button class="btn btn-outline" style="padding: 4px 12px; font-size: 12px;" onclick="clearHistory()">Clear Chat</button>
            </div>

            <div class="chat-container">
                <div class="chat-box" id="chat-box">
                    <div class="message msg-ai">Hello! I am your AI Crypto Advisor. Ask me anything about cryptocurrencies, markets, or trading strategies.</div>
                </div>
                
                <div class="chips">
                    <div class="chip" onclick="askPreset('What is Bitcoin?')">What is Bitcoin?</div>
                    <div class="chip" onclick="askPreset('Explain DeFi simply')">Explain DeFi simply</div>
                    <div class="chip" onclick="askPreset('How do I analyze a crypto chart?')">How do I analyze a crypto chart?</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Type your question..." onkeypress="if(event.key === 'Enter') sendMessage()">
                    <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="advisor.js"></script>
</body>
</html>
