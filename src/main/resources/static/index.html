<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CryptoHub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <script src="nav.js"></script>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <h2>Market Overview</h2>
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search coins by name or symbol...">
            </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 32px;">
            <div class="glass-card">
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">Global Market Cap</p>
                <h3 id="global-mcap" class="skeleton skeleton-title"></h3>
            </div>
            <div class="glass-card">
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">24h Volume</p>
                <h3 id="global-vol" class="skeleton skeleton-title"></h3>
            </div>
            <div class="glass-card">
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">Top Performer (24h)</p>
                <h3 id="top-performer" class="skeleton skeleton-title"></h3>
                <p id="top-performer-change" class="text-positive" style="font-size: 14px; font-weight: 500;"></p>
            </div>
        </div>

        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3>Top Cryptocurrencies</h3>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="font-size: 12px; color: var(--text-secondary);" id="refresh-timer">Auto-refresh in 60s</span>
                    <button class="btn btn-outline" id="refresh-btn" style="padding: 6px 12px;"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>
            
            <div class="table-container">
                <table id="crypto-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Coin</th>
                            <th>Price</th>
                            <th>24h Change</th>
                            <th>Market Cap</th>
                            <th>Volume (24h)</th>
                        </tr>
                    </thead>
                    <tbody id="crypto-table-body">
                        <!-- Filled by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
