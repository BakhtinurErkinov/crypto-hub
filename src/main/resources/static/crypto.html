<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Details | CryptoHub</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }
        .coin-title {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .coin-title img {
            width: 48px;
            height: 48px;
        }
        .time-filters {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .time-filters button {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .time-filters button.active, .time-filters button:hover {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 24px;
        }
        .stat-card {
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <script src="nav.js"></script>

    <div class="container">
        <a href="index.html" style="display: inline-block; margin-bottom: 24px; color: var(--text-secondary);">
            <i class="fas fa-arrow-left"></i> Back to Dashboard
        </a>

        <div class="glass-card">
            <div class="header-section">
                <div class="coin-title">
                    <img id="coin-img" src="" alt="" style="display:none;">
                    <div>
                        <h1 id="coin-name" class="skeleton skeleton-title"></h1>
                        <span id="coin-symbol" class="badge badge-purple" style="display:none;"></span>
                    </div>
                </div>
                <div style="text-align: right;">
                    <h1 id="coin-price" class="skeleton skeleton-title"></h1>
                    <span id="coin-change" class="" style="font-weight: 600;"></span>
                </div>
            </div>

            <div class="time-filters">
                <button class="time-btn" data-days="1">1D</button>
                <button class="time-btn active" data-days="7">1W</button>
                <button class="time-btn" data-days="30">1M</button>
                <button class="time-btn" data-days="365">1Y</button>
            </div>

            <div style="height: 400px; width: 100%; position: relative;">
                <canvas id="priceChart"></canvas>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">Market Cap</div>
                    <div class="stat-value" id="stat-mcap">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">24h Volume</div>
                    <div class="stat-value" id="stat-vol">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Circulating Supply</div>
                    <div class="stat-value" id="stat-supply">-</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">All Time High</div>
                    <div class="stat-value" id="stat-ath">-</div>
                </div>
            </div>
            
            <div style="margin-top: 32px;" id="coin-desc-container">
                <h3 style="margin-bottom: 12px;">About</h3>
                <p id="coin-desc" style="color: var(--text-secondary); line-height: 1.6; font-size: 14px;"></p>
            </div>
        </div>
    </div>

    <script src="crypto.js"></script>
</body>
</html>
